name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install rapidfuzz pydantic PyYAML pytest numpy Pillow jsonschema
      - run: python -m pytest -m "not slow"
      - name: results.example.json validates against schema and evaluate.py
        run: |
          python -c "import json,jsonschema;jsonschema.validate(json.load(open('data/results.example.json',encoding='utf-8')),json.load(open('data/results.schema.json',encoding='utf-8')))"
          python data/evaluate.py --reference data/results.example.json --predictions data/results.example.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm ci && npm run build
