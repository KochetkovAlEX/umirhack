# Пример пользовательского типа документа (бонус «новый тип без кода»).
# Чтобы добавить свой тип: скопируйте этот файл под новым именем, опишите поля
# (key, label, aliases, type, rule) и перезапустите сервис — тип появится в веб-интерфейсе,
# в Telegram-боте и в API /doc-types; поля извлекаются стандартными обработчиками
# (text, person_name, date, int, enum, doc_number, group, signature, seal).
# Пункты Положения (rule) для этого демонстрационного типа ссылаются на раздел 4,
# т.к. в учебном Положении отдельного раздела для заявления о переводе нет.
key: transfer_application
title: Заявление о переводе
rules_section: "4"
detect:
  title_keywords: ["заявление о переводе", "о переводе"]
  label_keywords: ["текущий вуз", "желаемое направление", "дата заявления"]
complete_message_rules: ["4.1", "4.2"]
not_required:
  seal: "4.3"
fields:
  - key: student_name
    label: ФИО студента
    aliases: ["фио", "фамилия", "имя студента", "как зовут студента", "кто студент", "кто подаёт заявление"]
    type: person_name
    rule: "4.1"
  - key: current_university
    label: Текущий вуз
    aliases: ["откуда переводится", "из какого вуза", "нынешний вуз", "текущий университет", "где учится сейчас"]
    type: text
    rule: "4.1"
  - key: target_program
    label: Желаемое направление
    aliases: ["куда переводится", "на какое направление", "целевое направление", "желаемая специальность"]
    type: text
    rule: "4.1"
  - key: application_date
    label: Дата заявления
    aliases: ["когда подано заявление", "дата подачи", "когда написано заявление", "число заявления"]
    type: date
    rule: "4.1"
  - key: signature_present
    label: Подпись студента
    aliases: ["подписано ли", "есть ли подпись", "подписал ли студент"]
    type: signature
    anchor: "подпись студента"
    rule: "4.2"
